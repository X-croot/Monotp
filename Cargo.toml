[package]
name = "monotp"
version = "1.0.0"
edition = "2021"
authors = ["X-croot <https://github.com/X-croot>"]
description = "Minimal, fully-encrypted, cross-platform TOTP authenticator written in Rust."
license = "MIT"
repository = "https://github.com/X-croot/monotp"
readme = "README.md"

[dependencies]
eframe = { version = "0.27", default-features = true }
egui = "0.27"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
data-encoding = "2"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
